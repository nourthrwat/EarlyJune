# Paste into https://api.slack.com/apps → Create New App → From a manifest.
# Replace YOUR-WORKER with your Cloudflare Worker URL (e.g. early-june-slack-bridge.<you>.workers.dev).
display_information:
  name: Early June Website
  description: Change the Early June website from Slack
features:
  bot_user:
    display_name: website
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    request_url: https://YOUR-WORKER/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://YOUR-WORKER/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
